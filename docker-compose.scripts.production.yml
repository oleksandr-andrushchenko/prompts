services:
  scripts-production:
    profiles:
      - production
    build:
      context: ./scripts
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      FUNCTION_TEMPLATES_DIR: "/app/api-lambda/templates"
    volumes:
      - ./:/app
      - ${HOME}/.aws:/root/.aws:ro
      # AWS login refreshes its cached OAuth token during long production jobs.
      - ${HOME}/.aws/login/cache:/root/.aws/login/cache
