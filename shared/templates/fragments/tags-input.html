<input id="{{ input_id|default('tags-input') }}"
       name="{{ field_name|default('tags') }}"
       type="text"
       class="form-control {{ class_name|default('') }}"
       placeholder="{{ placeholder|default('Tags') }}"
       value='{% if tag_items is defined and tag_items %}{{ tag_items | tojson | safe }}{% else %}{{ (value or []) | tojson | safe }}{% endif %}'
       data-url="{{ url }}"
       data-catalog-input
       data-max-items="{{ max_items|default(3) }}"
       data-min-length="{{ min_length|default(2) }}"
       data-max-length="{{ max_length|default(40) }}"
       {% if normalize_kebab|default(true) %}data-normalize-kebab{% endif %}
       {% if inject_hidden %}data-inject-hidden{% endif %}
       {% if auto_submit %}data-auto-submit{% endif %}
/>
