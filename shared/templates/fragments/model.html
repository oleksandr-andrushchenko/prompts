<div class="model col"{% if model.offset %} data-offset="{{ model.offset }}"{% endif %}>
    <a href="{{ prompts_url(model=model.slug) }}"
       class="card text-bg-light shadow-sm h-100 text-decoration-none link-body-emphasis">
        <div class="card-body d-flex flex-column justify-content-center">
            <h3 class="h6 mb-1 card-title font-monospace text-break">{{ model.name }}</h3>
            <small class="text-secondary">
                {{ model.published_prompts_count }} published prompt{% if model.published_prompts_count != 1 %}s{% endif %}
            </small>
        </div>
    </a>
</div>
