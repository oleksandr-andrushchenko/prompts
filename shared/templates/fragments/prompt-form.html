<form class="row" id="prompt-form" novalidate>
    <div class="col col-12 col-lg-6 col-xl-8">
        <label class="w-100">
            <textarea class="form-control h1 border-0" id="title" name="title" placeholder="Title"
                      required rows="1" autofocus>{{ prompt.title if prompt else "" }}</textarea>
        </label>
    </div>

    <div class="col col-12 col-lg-6 col-xl-8 d-flex flex-column gap-2">
        <label class="w-100">
            <textarea class="form-control editor" id="content" name="content" placeholder="Actual prompt" rows="8"
                      required minlength="1" maxlength="100000">{{ prompt.content if prompt else "" }}</textarea>
        </label>
        <div class="w-100">
            <div class="result-images-widget" id="result-images-widget">
                <label class="form-label text-secondary mb-1" for="image_files">Result images:</label>
                <input type="hidden" id="image_filenames" name="image_filenames"
                       value="{{ prompt.image_filenames|join(", ") if prompt else "" }}">
                <input class="form-control" type="file" id="image_files" accept="image/jpeg,image/png,image/gif" multiple data-form-ignore>
                <div class="input-group mt-2">
                    <input class="form-control" type="url" id="image_url" placeholder="Paste an image URL">
                    <button class="btn btn-outline-secondary" type="button" id="add-image-url">Add URL</button>
                </div>
                <div class="form-text">Choose multiple files or add images by URL. Dragging files here also works.</div>
                <div class="row row-cols-2 row-cols-md-3 g-2 mt-1" id="result-image-previews" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <div class="col col-12 col-lg-6 col-xl-4 d-flex flex-column gap-2">
        <label class="w-100">
            <span class="text-secondary">Model:</span>
            <select class="form-select" name="model_slug">
                <option value="" data-version="" {% if not prompt or not prompt.model %}selected{% endif %}>Model not specified</option>
                {% for model in PROMPT_MODELS %}
                    <option value="{{ model.slug }}" data-version="{{ model.version }}" {% if prompt and prompt.model and prompt.model.slug == model.slug %}selected{% endif %}>{{ model.title }} ({{ model.version }})</option>
                {% endfor %}
            </select>
            <input type="hidden" name="model_version" value="{{ prompt.model.version if prompt and prompt.model else "" }}">
        </label>

        <small class="text-secondary bi bi-tags"> Tags:</small>
        {% with url=url("get-tags", absolute=True), value=prompt.tags if prompt else [] %}
            {% include "fragments/tags-input.html" %}
        {% endwith %}

        <div>
            <button type="submit" class="btn btn-light">
                <i class="bi {% if prompt %}bi-arrow-clockwise{% else %}bi-plus-lg{% endif %}"></i>
                {% if prompt %}Update{% else %}Create{% endif %} prompt
            </button>
        </div>
    </div>
</form>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    handleFormSubmit("#prompt-form", {{ (url('update-prompt', prompt_id=prompt.id, absolute=True) if prompt else url('create-prompt', absolute=True)) | tojson }}, {
      method: "{{ 'PATCH' if prompt else 'POST' }}",
      rules: {
        title: [
          {rule: "required"},
          {rule: "minLength", value: 10},
          {rule: "maxLength", value: 500}
        ],
        content: [
          {rule: "required"},
          {rule: "minLength", value: 1},
          {rule: "maxLength", value: 100_000}
        ],
        tags: [
          {rule: "required"},
          {rule: "tags", minCnt: 1, maxCnt: 3, minLen: 2, maxLen: 40}
        ]
      },
      onSuccess: (res) => {
        if (res) window.location.href = res
      },
      beforeSubmit: async (data) => {
        const widget = document.getElementById("result-images-widget")
        const items = widget._imageItems || []
        const uploaded = await Promise.all(items.filter(item => item.upload).map(item => uploadPublicFile(item.file)))
        const values = [...items.filter(item => !item.upload).map(item => item.value), ...uploaded]
        data.image_filenames = values.length ? values.join(", ") : null
        document.getElementById("image_filenames").value = data.image_filenames || ""
      },
      successMessage: "Prompt created!"
    })
  })

  document.addEventListener("DOMContentLoaded", () => {
    const widget = document.getElementById("result-images-widget")
    if (!widget) return
    const fileInput = document.getElementById("image_files")
    const urlInput = document.getElementById("image_url")
    const preview = document.getElementById("result-image-previews")
    const hidden = document.getElementById("image_filenames")
    const items = ({{ (prompt.image_filenames if prompt else []) | tojson }}).map(value => ({value, preview: value}))
    const files = []
    widget._imageItems = items
    widget._imageFiles = files

    const imageSrc = value => /^(https?:|data:)/i.test(value) ? value : {{ static_url("{filename}") | tojson }}.replace("{filename}", value)
    const render = () => {
      preview.replaceChildren()
      items.forEach((item, index) => {
        const col = document.createElement("div")
        col.className = "col"
        col.innerHTML = `<div class="position-relative border rounded p-1 h-100"><img class="w-100 rounded object-fit-cover" style="height: 120px" alt="Result image ${index + 1}"><button type="button" class="btn btn-sm btn-dark position-absolute top-0 end-0 m-1" aria-label="Remove image"><i class="bi bi-x"></i></button></div>`
        col.querySelector("img").src = item.upload ? item.preview : imageSrc(item.preview)
        col.querySelector("button").addEventListener("click", () => { items.splice(index, 1); render() })
        preview.append(col)
      })
      hidden.value = items.filter(item => !item.upload).map(item => item.value).join(", ")
    }
    const addFiles = selected => selected.forEach(file => {
      if (!file.type.startsWith("image/") || files.some(existing => existing.name === file.name && existing.size === file.size)) return
      files.push(file)
      items.push({upload: true, file, preview: URL.createObjectURL(file)})
    })
    fileInput.addEventListener("change", () => { addFiles([...fileInput.files]); fileInput.value = ""; render() })
    widget.addEventListener("dragover", event => { event.preventDefault(); widget.classList.add("border", "border-primary") })
    widget.addEventListener("dragleave", () => widget.classList.remove("border", "border-primary"))
    widget.addEventListener("drop", event => { event.preventDefault(); widget.classList.remove("border", "border-primary"); addFiles([...event.dataTransfer.files]); render() })
    document.getElementById("add-image-url").addEventListener("click", () => {
      const value = urlInput.value.trim()
      if (!value || !/^https?:\/\//i.test(value) || items.some(item => item.value === value)) return
      items.push({value, preview: value}); urlInput.value = ""; render()
    })
    render()
  })
</script>
